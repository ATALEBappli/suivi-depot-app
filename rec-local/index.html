<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suivi Dépôt — REC</title><link rel="stylesheet" href="/local/style.css"><script type="module" src="/local/app.mjs"></script></head><body><header><h1>Suivi Dépôt <small>REC</small></h1><p>Environnement de recette — opérations de test uniquement</p></header><main><p id="notice" role="status" aria-live="polite"></p><section id="bootstrap" hidden><h2>Premier administrateur REC</h2><p>Installation privée à usage unique. Saisissez le jeton provisoire enregistré dans les secrets Cloudflare REC. Ne partagez jamais ce jeton ni votre mot de passe.</p><form id="bootstrap-form"><label>Jeton provisoire<input name="setupToken" type="password" autocomplete="off" required minlength="43" maxlength="128" autocapitalize="none" spellcheck="false"></label><label>Identifiant administrateur<input name="username" autocomplete="username" required minlength="3" maxlength="64" autocapitalize="none" spellcheck="false"></label><label>Mot de passe administrateur (15 caractères minimum)<input name="password" type="password" autocomplete="new-password" required minlength="15" maxlength="128"></label><button type="submit">Créer mon administrateur REC</button></form></section><section id="login"><h2>Connexion</h2><form id="login-form"><label>Identifiant<input name="username" autocomplete="username" required maxlength="64" autocapitalize="none" spellcheck="false"></label><label>Mot de passe<input name="password" type="password" autocomplete="current-password" required></label><button>Se connecter</button></form></section><section id="workspace" hidden><p id="identity"></p><nav id="nav"><button data-view="summary">Synthèse</button><button data-view="entry">Saisie</button><button data-view="settings">Paramétrage</button><button data-view="account">Mon compte</button><button id="logout">Déconnexion</button></nav><section id="view"></section></section></main></body></html>
