name: REC-Maintenance — tests sur mocks
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  mocks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/rec-maintenance.mjs
      - uses: actions/checkout@v4
        with:
          repository: ATALEBappli/suivi-depot-demo
          ref: 8cee35c60b77ee4cd01960990c4ad937cf52d2d9
          path: work/rec-frontend
          persist-credentials: false
      - run: npm ci --prefix rec-worker
      - run: node rec-worker/prepare.mjs work/rec-frontend 8cee35c60b77ee4cd01960990c4ad937cf52d2d9
      - run: node --test tests/rec-automation/*.test.mjs tests/rec-server/*.test.mjs tests/rec-worker/*.test.mjs
      - run: npm run --prefix rec-worker check
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Préparer et tester le bundle compilé exact, sans publication
        run: |
          node rec-worker/release.mjs create /tmp/rec-worker-dry-run rec-server/public work/rec-worker-release "$GITHUB_SHA"
          node tests/rec-worker/release-smoke.mjs work/rec-worker-release "$GITHUB_SHA"
