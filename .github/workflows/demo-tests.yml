name: Prototype V2 — tests hors réseau
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test tests/demo.mjs tests/demo-pages.mjs tests/finance.mjs
