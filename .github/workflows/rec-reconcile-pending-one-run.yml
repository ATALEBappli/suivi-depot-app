name: REC — clôturer le reçu publié version 4

on:
  workflow_dispatch:
    inputs:
      deployment_sha256:
        type: string
        required: true
        description: Empreinte complète du déploiement issue du diagnostic #51
      operation_sha256:
        type: string
        required: true
        description: Empreinte complète du reçu issue du diagnostic #51
      audit_confirmed:
        type: boolean
        default: false
        required: true
        description: J'autorise uniquement la clôture du reçu REC déjà publié en version 4, aucune publication ni migration

permissions:
  contents: read
concurrency:
  group: apps-script-rec
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'ATALEBappli/suivi-depot-app' && github.ref == 'refs/heads/main' && vars.REC_AUTOMATION_ENABLED == 'true' && vars.REC_MUTATIONS_ENABLED == 'true' && inputs.audit_confirmed == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Exécuter les tests de sécurité hors réseau
        run: node --test tests/rec-automation/*.test.mjs
  reconcile:
    needs: prepare
    environment: REC
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Archiver le reçu original et clôturer la seule opération validée
        env:
          REC_AUTOMATION_ENABLED: ${{ vars.REC_AUTOMATION_ENABLED }}
          REC_MUTATIONS_ENABLED: ${{ vars.REC_MUTATIONS_ENABLED }}
          REC_RECONCILE_CONFIRMED: ${{ inputs.audit_confirmed }}
          REC_GATEWAY_TRANSPORT: 'true'
          REC_EXPECTED_DEPLOYMENT_HASH: ${{ inputs.deployment_sha256 }}
          REC_EXPECTED_OPERATION_HASH: ${{ inputs.operation_sha256 }}
          REC_SCRIPT_ID: ${{ secrets.REC_SCRIPT_ID }}
          REC_SHEET_ID: ${{ secrets.REC_SHEET_ID }}
          REC_GOOGLE_EMAIL: ${{ secrets.REC_GOOGLE_EMAIL }}
          REC_OWNER_EMAIL: ${{ secrets.REC_OWNER_EMAIL }}
          REC_DEPLOYMENT_ID: ${{ secrets.REC_DEPLOYMENT_ID }}
          REC_GOOGLE_OAUTH: ${{ secrets.REC_GOOGLE_OAUTH }}
        run: node scripts/rec-automation/reconcile-pending-one-run.mjs
