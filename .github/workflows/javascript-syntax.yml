name: Syntaxe JavaScript

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Vérifier la syntaxe sans exécuter l’application
        run: node scripts/check-js.mjs

      - name: Tester l'automatisation REC sur doublures sans secrets
        run: node --test tests/rec-automation/*.test.mjs
      - name: Vérifier le référentiel V2 et ses régressions sans réseau
        run: |
          node tests/referentiel-v2.mjs
          node tests/import-referentiel-v2.mjs
          node tests/referentiel-v2-ergonomie.mjs
          node scripts/check-apps-script.mjs
          node tests/rec-synchronisation.mjs
          node tests/isolation.mjs
