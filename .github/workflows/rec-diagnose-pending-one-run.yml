name: REC — diagnostic lecture seule du run 45038142518

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: apps-script-rec
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'ATALEBappli/suivi-depot-app' && github.ref == 'refs/heads/main' && vars.REC_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Tester les protections sans secrets Google
        run: node --test tests/rec-automation/*.test.mjs
  diagnose:
    needs: prepare
    environment: REC
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Examiner exclusivement le reçu pending et la version publique REC
        env:
          REC_AUTOMATION_ENABLED: ${{ vars.REC_AUTOMATION_ENABLED }}
          REC_GATEWAY_TRANSPORT: 'true'
          REC_SCRIPT_ID: ${{ secrets.REC_SCRIPT_ID }}
          REC_SHEET_ID: ${{ secrets.REC_SHEET_ID }}
          REC_GOOGLE_EMAIL: ${{ secrets.REC_GOOGLE_EMAIL }}
          REC_OWNER_EMAIL: ${{ secrets.REC_OWNER_EMAIL }}
          REC_DEPLOYMENT_ID: ${{ secrets.REC_DEPLOYMENT_ID }}
          REC_GOOGLE_OAUTH: ${{ secrets.REC_GOOGLE_OAUTH }}
        run: node scripts/rec-automation/diagnose-pending-one-run.mjs
