name: Isolation REC PROD
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/isolation.mjs
      - run: node scripts/check-apps-script.mjs
      - run: APP_ENV=REC node scripts/build-frontend.mjs
